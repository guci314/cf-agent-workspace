# Cloudflare **Workers + 静态资源**（不是老版 Pages —— wrangler 4 起 Pages 已并入
# Workers，`pages project create` 会走去重路径然后报缺 entry-point）。
# 好处：不用先建项目，`wrangler deploy` 首次自己创建。
#
# ⚠️ name 要和目录名一致 —— workflow 用它当部署名。
name = "agent-sandbox"
compatibility_date = "2026-09-01"

# 纯静态站点：没有 main 入口，只有 assets
[assets]
directory = "./public"
